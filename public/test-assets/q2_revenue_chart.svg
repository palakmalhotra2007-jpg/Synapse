<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="barPeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glowChart" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="60" y="65" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="0.5">Quarterly Enterprise Revenue &amp; ARR Telemetry</text>
  <text x="60" y="92" fill="#94a3b8" font-size="13" font-weight="500">H1 2026 Fiscal Performance • Fraud Intelligence &amp; RAG Enterprise Adoption</text>

  <!-- Legend -->
  <g transform="translate(680, 50)">
    <rect x="0" y="0" width="260" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="18" width="16" height="14" rx="3" fill="#38bdf8"/>
    <text x="38" y="30" fill="#cbd5e1" font-size="11" font-weight="600">Monthly Revenue ($M)</text>
    <line x1="160" y1="25" x2="185" y2="25" stroke="#4ade80" stroke-width="3"/>
    <circle cx="172.5" cy="25" r="4" fill="#4ade80"/>
    <text x="193" y="30" fill="#cbd5e1" font-size="11" font-weight="600">MoM %</text>
  </g>

  <!-- Grid Lines & Y-Axis Scale ($0M to $35M) -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <!-- $35M -->
    <line x1="120" y1="140" x2="920" y2="140"/><text x="100" y="145" fill="#64748b" font-size="11" text-anchor="end">$35M</text>
    <!-- $30M -->
    <line x1="120" y1="200" x2="920" y2="200"/><text x="100" y="205" fill="#64748b" font-size="11" text-anchor="end">$30M</text>
    <!-- $25M -->
    <line x1="120" y1="260" x2="920" y2="260"/><text x="100" y="265" fill="#64748b" font-size="11" text-anchor="end">$25M</text>
    <!-- $20M -->
    <line x1="120" y1="320" x2="920" y2="320"/><text x="100" y="325" fill="#64748b" font-size="11" text-anchor="end">$20M</text>
    <!-- $15M -->
    <line x1="120" y1="380" x2="920" y2="380"/><text x="100" y="385" fill="#64748b" font-size="11" text-anchor="end">$15M</text>
    <!-- $10M -->
    <line x1="120" y1="440" x2="920" y2="440"/><text x="100" y="445" fill="#64748b" font-size="11" text-anchor="end">$10M</text>
    <!-- $5M -->
    <line x1="120" y1="500" x2="920" y2="500"/><text x="100" y="505" fill="#64748b" font-size="11" text-anchor="end">$5M</text>
  </g>

  <!-- Axis Lines -->
  <line x1="120" y1="130" x2="120" y2="540" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="540" x2="920" y2="540" stroke="#475569" stroke-width="2"/>

  <!-- BAR 1: Jan 2026 - $18.2M (height = 18.2 * 12 = 218.4, y = 540 - 218.4 = 321.6) -->
  <g transform="translate(160, 0)">
    <rect x="0" y="321.6" width="80" height="218.4" rx="8" fill="url(#barGrad)"/>
    <text x="40" y="305" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">$18.2M</text>
    <text x="40" y="570" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">Jan 2026</text>
    <text x="40" y="590" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">+12.0%</text>
  </g>

  <!-- BAR 2: Feb 2026 - $21.4M (height = 21.4 * 12 = 256.8, y = 540 - 256.8 = 283.2) -->
  <g transform="translate(290, 0)">
    <rect x="0" y="283.2" width="80" height="256.8" rx="8" fill="url(#barGrad)"/>
    <text x="40" y="266" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">$21.4M</text>
    <text x="40" y="570" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">Feb 2026</text>
    <text x="40" y="590" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">+17.5%</text>
  </g>

  <!-- BAR 3: Mar 2026 - $24.8M (height = 24.8 * 12 = 297.6, y = 540 - 297.6 = 242.4) -->
  <g transform="translate(420, 0)">
    <rect x="0" y="242.4" width="80" height="297.6" rx="8" fill="url(#barGrad)"/>
    <text x="40" y="225" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">$24.8M</text>
    <text x="40" y="570" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">Mar 2026</text>
    <text x="40" y="590" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">+15.8%</text>
  </g>

  <!-- BAR 4: Apr 2026 - $23.9M (height = 23.9 * 12 = 286.8, y = 540 - 286.8 = 253.2) -->
  <g transform="translate(550, 0)">
    <rect x="0" y="253.2" width="80" height="286.8" rx="8" fill="url(#barGrad)"/>
    <text x="40" y="236" fill="#f43f5e" font-size="13" font-weight="800" text-anchor="middle">$23.9M</text>
    <text x="40" y="570" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">Apr 2026</text>
    <text x="40" y="590" fill="#f43f5e" font-size="10" font-weight="700" text-anchor="middle">-3.6%</text>
    <!-- Anomaly Badge -->
    <rect x="-10" y="200" width="100" height="22" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
    <text x="40" y="215" fill="#ffe4e6" font-size="9" font-weight="700" text-anchor="middle">KEY ROTATION DIP</text>
  </g>

  <!-- BAR 5: May 2026 - $27.6M (height = 27.6 * 12 = 331.2, y = 540 - 331.2 = 208.8) -->
  <g transform="translate(680, 0)">
    <rect x="0" y="208.8" width="80" height="331.2" rx="8" fill="url(#barGrad)"/>
    <text x="40" y="192" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle">$27.6M</text>
    <text x="40" y="570" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">May 2026</text>
    <text x="40" y="590" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">+15.4%</text>
  </g>

  <!-- BAR 6: Jun 2026 (Peak) - $31.2M (height = 31.2 * 12 = 374.4, y = 540 - 374.4 = 165.6) -->
  <g transform="translate(810, 0)">
    <rect x="0" y="165.6" width="80" height="374.4" rx="8" fill="url(#barPeakGrad)" stroke="#c084fc" stroke-width="2" filter="url(#glowChart)"/>
    <text x="40" y="148" fill="#e9d5ff" font-size="14" font-weight="900" text-anchor="middle">$31.2M PEAK</text>
    <text x="40" y="570" fill="#e9d5ff" font-size="12" font-weight="800" text-anchor="middle">Jun 2026</text>
    <text x="40" y="590" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">+13.0%</text>
  </g>

  <!-- Trend Overlay Line Connecting Bar Tops -->
  <path d="M 200 321.6 L 330 283.2 L 460 242.4 L 590 253.2 L 720 208.8 L 850 165.6" fill="none" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glowChart)"/>
  <circle cx="200" cy="321.6" r="6" fill="#4ade80"/>
  <circle cx="330" cy="283.2" r="6" fill="#4ade80"/>
  <circle cx="460" cy="242.4" r="6" fill="#4ade80"/>
  <circle cx="590" cy="253.2" r="6" fill="#f43f5e"/>
  <circle cx="720" cy="208.8" r="6" fill="#4ade80"/>
  <circle cx="850" cy="165.6" r="8" fill="#c084fc" stroke="#ffffff" stroke-width="2"/>

  <!-- Watermark & Footer -->
  <text x="520" y="630" fill="#475569" font-size="11" font-weight="600" text-anchor="middle">SYNAPSE MULTIMODAL AI CHART UNDERSTANDING TEST SUITE • GENERATED FOR AGENT TESTING</text>
</svg>
