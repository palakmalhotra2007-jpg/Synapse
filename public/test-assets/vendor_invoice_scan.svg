<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Courier New', Courier, monospace;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Document Page Background -->
  <rect x="40" y="40" width="720" height="920" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>

  <!-- Watermark Stamp -->
  <g transform="translate(400, 500) rotate(-30)">
    <rect x="-180" y="-40" width="360" height="80" rx="12" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="12 6" opacity="0.25"/>
    <text x="0" y="12" fill="#dc2626" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="4" opacity="0.3">CONFIDENTIAL SCAN</text>
  </g>

  <!-- Header & Logo -->
  <text x="80" y="100" fill="#0f172a" font-size="22" font-weight="800">APEX CLOUD ENTERPRISE INC.</text>
  <text x="80" y="120" fill="#64748b" font-size="12">100 Technology Way, Suite 400 • San Francisco, CA 94105</text>

  <!-- Invoice Details Right Side -->
  <text x="680" y="100" fill="#0f172a" font-size="20" font-weight="800" text-anchor="end">INVOICE &amp; WIRE SPEC</text>
  <text x="680" y="122" fill="#334155" font-size="12" text-anchor="end">Invoice #: INV-9042</text>
  <text x="680" y="140" fill="#334155" font-size="12" text-anchor="end">Date: August 28, 2026</text>
  <text x="680" y="158" fill="#dc2626" font-size="12" font-weight="700" text-anchor="end">Due Date: IMMEDIATE WIRE</text>

  <line x1="80" y1="180" x2="720" y2="180" stroke="#0f172a" stroke-width="2"/>

  <!-- Bill To & Beneficiary -->
  <text x="80" y="210" fill="#475569" font-size="12" font-weight="700">BILL TO:</text>
  <text x="80" y="230" fill="#0f172a" font-size="14" font-weight="800">Synapse Enterprise Corp</text>
  <text x="80" y="250" fill="#334155" font-size="12">Attn: Finance &amp; Accounts Payable</text>

  <text x="440" y="210" fill="#475569" font-size="12" font-weight="700">BENEFICIARY ROUTING (ALTERED AREA):</text>
  <rect x="435" y="218" width="285" height="75" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" rx="4"/>
  <text x="445" y="238" fill="#991b1b" font-size="11" font-weight="700">Bank: Cayman Global Gateway</text>
  <text x="445" y="256" fill="#991b1b" font-size="11" font-weight="700">IBAN: KY88-9021-4800-1940</text>
  <text x="445" y="274" fill="#991b1b" font-size="11" font-weight="700">SWIFT/BIC: CYMGKY33XXX</text>

  <!-- Items Table -->
  <rect x="80" y="320" width="640" height="35" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="100" y="342" fill="#0f172a" font-size="12" font-weight="700">DESCRIPTION</text>
  <text x="480" y="342" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">QTY</text>
  <text x="580" y="342" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">RATE</text>
  <text x="700" y="342" fill="#0f172a" font-size="12" font-weight="700" text-anchor="end">AMOUNT</text>

  <!-- Line 1 -->
  <text x="100" y="380" fill="#334155" font-size="12">Q3 Enterprise Compute Reservation</text>
  <text x="480" y="380" fill="#334155" font-size="12" text-anchor="end">1</text>
  <text x="580" y="380" fill="#334155" font-size="12" text-anchor="end">$250,000</text>
  <text x="700" y="380" fill="#334155" font-size="12" text-anchor="end">$250,000.00</text>

  <!-- Line 2 (Altered Wire Surcharge) -->
  <text x="100" y="415" fill="#991b1b" font-size="12" font-weight="700">Offshore Clearing Emergency Reserve (UNAUTHORIZED)</text>
  <text x="480" y="415" fill="#991b1b" font-size="12" text-anchor="end">1</text>
  <text x="580" y="415" fill="#991b1b" font-size="12" text-anchor="end">$1,200,000</text>
  <text x="700" y="415" fill="#991b1b" font-size="12" font-weight="800" text-anchor="end">$1,200,000.00</text>

  <line x1="80" y1="440" x2="720" y2="440" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Total Box -->
  <rect x="440" y="460" width="280" height="70" fill="#1e293b" rx="6"/>
  <text x="460" y="488" fill="#94a3b8" font-size="12" font-weight="600">TOTAL REQUESTED WIRE:</text>
  <text x="700" y="510" fill="#ef4444" font-size="20" font-weight="900" text-anchor="end">$1,450,000.00 USD</text>

  <!-- Signature Block -->
  <g transform="translate(80, 720)">
    <text x="0" y="0" fill="#475569" font-size="12" font-weight="700">AUTHORIZED EXECUTIVE SIGNATURE:</text>
    <path d="M 10 40 Q 40 10, 80 45 T 140 20 T 200 50" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="0" y1="60" x2="250" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="78" fill="#0f172a" font-size="12" font-weight="800">David Miller, VP Corporate Controller</text>
  </g>

  <!-- Security Verification Footer -->
  <rect x="80" y="850" width="640" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <text x="100" y="875" fill="#64748b" font-size="10" font-weight="700">SYNAPSE FORENSIC STAMP:</text>
  <text x="100" y="895" fill="#dc2626" font-size="11" font-weight="700">pHash: 0x8a92f03b1c • Tampering Probability: 88.4% (IBAN &amp; Amount Mismatch)</text>
</svg>
