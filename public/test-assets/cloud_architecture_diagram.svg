<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0b0f19; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <text x="50" y="55" fill="#f8fafc" font-size="22" font-weight="800">Synapse Enterprise AI Cloud Infrastructure Topology</text>
  <text x="50" y="80" fill="#64748b" font-size="12" font-weight="600">High-Availability Microservices, RAG Vector Memory &amp; Multimodal AI Engine</text>

  <!-- Flow Lines -->
  <g stroke="#334155" stroke-width="3" fill="none">
    <path d="M 180 240 L 260 240 M 420 240 L 500 180 M 420 240 L 500 320 M 680 180 L 760 180 M 680 320 L 760 320" stroke-dasharray="6 3"/>
  </g>

  <!-- 1. API Gateway & Auth Proxy (50, 180, 130, 120) -->
  <g transform="translate(50, 170)">
    <rect x="0" y="0" width="140" height="140" rx="16" fill="url(#gatewayGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="70" y="55" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">API GATEWAY</text>
    <text x="70" y="75" fill="#dbeafe" font-size="11" font-weight="600" text-anchor="middle">&amp; OAuth Auth Proxy</text>
    <rect x="15" y="95" width="110" height="24" rx="6" fill="#1e3a8a" opacity="0.8"/>
    <text x="70" y="111" fill="#93c5fd" font-size="10" font-weight="700" text-anchor="middle">Port 443 / TLS 1.3</text>
  </g>

  <!-- 2. High-Capacity Load Balancer (250, 180, 130, 120) -->
  <g transform="translate(250, 170)">
    <rect x="0" y="0" width="150" height="140" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="50" fill="#f8fafc" font-size="13" font-weight="800" text-anchor="middle">LOAD BALANCER</text>
    <text x="75" y="70" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Cloud Run Traffic Ingress</text>
    <text x="75" y="90" fill="#94a3b8" font-size="10" text-anchor="middle">Auto-Scale: 50 Pods</text>
    <text x="75" y="115" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">● 99.99% Uptime</text>
  </g>

  <!-- 3. Microservice Pods Cluster (480, 100, 200, 150) -->
  <g transform="translate(470, 110)">
    <rect x="0" y="0" width="220" height="140" rx="16" fill="url(#aiGrad)" stroke="#c084fc" stroke-width="2"/>
    <text x="110" y="45" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">MULTIMODAL AI CORPUS</text>
    <text x="110" y="68" fill="#f3e8ff" font-size="11" font-weight="600" text-anchor="middle">Vision &amp; Speech Subsystem</text>
    <rect x="20" y="85" width="180" height="36" rx="8" fill="#3b0764" opacity="0.9"/>
    <text x="110" y="107" fill="#e9d5ff" font-size="10" font-weight="700" text-anchor="middle">Gemini 3.6 Vision &amp; Embeddings</text>
  </g>

  <!-- 4. Distributed Cache Layer (470, 280, 220, 130) -->
  <g transform="translate(470, 280)">
    <rect x="0" y="0" width="220" height="130" rx="16" fill="url(#cacheGrad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="45" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">REDIS CLUSTER MEMORY</text>
    <text x="110" y="68" fill="#fef3c7" font-size="11" font-weight="600" text-anchor="middle">Sub-millisecond Session Store</text>
    <text x="110" y="95" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">128GB In-Memory Cache</text>
  </g>

  <!-- 5. Vector DB Milvus / PGVector (740, 110, 200, 140) -->
  <g transform="translate(740, 110)">
    <rect x="0" y="0" width="200" height="140" rx="16" fill="url(#dbGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="45" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">RAG VECTOR DB</text>
    <text x="100" y="68" fill="#d1fae5" font-size="11" font-weight="600" text-anchor="middle">Enterprise Document HNSW</text>
    <text x="100" y="95" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">1.2M High-Dim Embeddings</text>
  </g>

  <!-- 6. Relational SQL & Audit Ledger DB (740, 280, 200, 130) -->
  <g transform="translate(740, 280)">
    <rect x="0" y="0" width="200" height="130" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <text x="100" y="45" fill="#f8fafc" font-size="13" font-weight="800" text-anchor="middle">FIRESTORE &amp; SQL LEDGER</text>
    <text x="100" y="68" fill="#7dd3fc" font-size="11" text-anchor="middle">Transactions &amp; User Vaults</text>
    <text x="100" y="95" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">AES-256 Encrypted</text>
  </g>

  <!-- Bottom Legend & Info -->
  <rect x="50" y="470" width="890" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="80" y="505" fill="#f8fafc" font-size="14" font-weight="800">ARCHITECTURE COMPONENT MATRIX:</text>
  <text x="80" y="530" fill="#94a3b8" font-size="12">• Component 1: API Gateway (Edge Ingress) • Component 2: Cloud Load Balancer (Auto-scale)</text>
  <text x="80" y="555" fill="#94a3b8" font-size="12">• Component 3: Multimodal Vision AI Model • Component 4: Redis Session Cache</text>
  <text x="80" y="580" fill="#94a3b8" font-size="12">• Component 5: RAG Vector Database • Component 6: Encrypted SQL Transaction Ledger</text>
</svg>
