<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0b1329; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- PCB Board Outline -->
  <rect x="50" y="40" width="900" height="570" rx="24" fill="url(#pcbGrad)" stroke="#10b981" stroke-width="4"/>
  <rect x="65" y="55" width="870" height="540" rx="16" fill="none" stroke="#047857" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- PCB Copper Traces -->
  <path d="M 120 120 L 320 120 L 400 200 L 400 270" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <path d="M 400 370 L 400 450 L 300 520 L 150 520" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <path d="M 520 270 L 620 270 L 680 180 L 800 180" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>
  <path d="M 520 370 L 620 370 L 680 480 L 800 480" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4"/>

  <!-- Title & Model Badge -->
  <text x="90" y="95" fill="#ecfdf5" font-size="22" font-weight="800" letter-spacing="1">RADIONA ULX3S FPGA V3.1.7</text>
  <text x="90" y="118" fill="#6ee7b7" font-size="13" font-weight="600">Open-Source Lattice ECP5 Hardware Architecture</text>

  <!-- 1. Central Lattice ECP5 FPGA IC (38%, 30%, 28%, 28%) -->
  <g transform="translate(380, 200)">
    <rect x="0" y="0" width="240" height="240" rx="12" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <!-- BGA Pins Grid Emulation -->
    <rect x="15" y="15" width="210" height="210" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
    <text x="120" y="110" fill="#f8fafc" font-size="16" font-weight="800" text-anchor="middle">LATTICE ECP5</text>
    <text x="120" y="132" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">LFE5U-85F-6BG381C</text>
    <text x="120" y="152" fill="#94a3b8" font-size="11" text-anchor="middle">84K LUTs • 3.7Mb BRAM</text>
    <circle cx="30" cy="30" r="5" fill="#38bdf8"/>
  </g>

  <!-- 2. IS42S16160G 32MB SDRAM Memory (50%, 15%, 14%, 18%) -->
  <g transform="translate(420, 80)">
    <rect x="0" y="0" width="160" height="90" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="80" y="45" fill="#f3e8ff" font-size="13" font-weight="700" text-anchor="middle">ISSI SDRAM 32MB</text>
    <text x="80" y="65" fill="#c084fc" font-size="10" text-anchor="middle">IS42S16160G - 166MHz</text>
    <!-- IC Pins -->
    <line x1="-10" y1="20" x2="0" y2="20" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="-10" y1="40" x2="0" y2="40" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="-10" y1="60" x2="0" y2="60" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="160" y1="20" x2="170" y2="20" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="160" y1="40" x2="170" y2="40" stroke="#cbd5e1" stroke-width="3"/>
    <line x1="160" y1="60" x2="170" y2="60" stroke="#cbd5e1" stroke-width="3"/>
  </g>

  <!-- 3. FTDI Programmer & ESP32 Co-processor (15%, 15%, 18%, 20%) -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <text x="90" y="40" fill="#cffafe" font-size="13" font-weight="700" text-anchor="middle">FTDI FT231X &amp; ESP32</text>
    <text x="90" y="62" fill="#22d3ee" font-size="11" text-anchor="middle">JTAG &amp; Serial Bridge</text>
    <rect x="20" y="80" width="140" height="30" rx="4" fill="#1e293b" stroke="#0891b2" stroke-width="1"/>
    <text x="90" y="100" fill="#94a3b8" font-size="10" text-anchor="middle">Wi-Fi / BT Core</text>
  </g>

  <!-- 4. Tactile Push Buttons B0-B6 & DIP Switches (65%, 45%, 25%, 35%) -->
  <g transform="translate(670, 260)">
    <rect x="0" y="0" width="220" height="240" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="110" y="30" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">TACTILE PUSH BUTTONS</text>

    <!-- Buttons -->
    <circle cx="110" cy="70" r="18" fill="#ef4444" stroke="#f87171" stroke-width="2"/>
    <text x="110" y="74" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">UP</text>

    <circle cx="60" cy="120" r="18" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
    <text x="60" y="124" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">LEFT</text>

    <circle cx="160" cy="120" r="18" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
    <text x="160" y="124" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">RGHT</text>

    <circle cx="110" cy="170" r="18" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
    <text x="110" y="174" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">DOWN</text>

    <circle cx="110" cy="120" r="14" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="124" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">FIRE</text>

    <!-- DIP Switches -->
    <rect x="30" y="200" width="160" height="25" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="217" fill="#fbbf24" font-size="10" font-weight="700" text-anchor="middle">4-BIT DIP CONFIG SWITCHES</text>
  </g>

  <!-- 5. GPIO Pin Headers & PMOD Expansion (75%, 10%, 15%, 80%) -->
  <g transform="translate(860, 60)">
    <rect x="0" y="0" width="70" height="520" rx="8" fill="#022c22" stroke="#059669" stroke-width="2"/>
    <text x="35" y="30" fill="#6ee7b7" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(90 35 30)">GPIO &amp; PMOD EXPANSION</text>
    <!-- Pin Dots -->
    <g fill="#fbbf24" stroke="#d97706" stroke-width="1">
      <circle cx="20" cy="80" r="4"/><circle cx="50" cy="80" r="4"/>
      <circle cx="20" cy="120" r="4"/><circle cx="50" cy="120" r="4"/>
      <circle cx="20" cy="160" r="4"/><circle cx="50" cy="160" r="4"/>
      <circle cx="20" cy="200" r="4"/><circle cx="50" cy="200" r="4"/>
      <circle cx="20" cy="240" r="4"/><circle cx="50" cy="240" r="4"/>
      <circle cx="20" cy="280" r="4"/><circle cx="50" cy="280" r="4"/>
      <circle cx="20" cy="320" r="4"/><circle cx="50" cy="320" r="4"/>
      <circle cx="20" cy="360" r="4"/><circle cx="50" cy="360" r="4"/>
      <circle cx="20" cy="400" r="4"/><circle cx="50" cy="400" r="4"/>
      <circle cx="20" cy="440" r="4"/><circle cx="50" cy="440" r="4"/>
      <circle cx="20" cy="480" r="4"/><circle cx="50" cy="480" r="4"/>
    </g>
  </g>

  <!-- 6. Micro-USB Power & Bitstream Flash Port (25%, 10%, 12%, 12%) -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="140" height="90" rx="8" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect x="25" y="25" width="90" height="40" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="70" y="50" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">MICRO-USB</text>
    <text x="70" y="80" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">5V Power &amp; JTAG</text>
  </g>

  <!-- Watermark & Status -->
  <text x="500" y="600" fill="#059669" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="2">SYNAPSE MULTIMODAL AI HARDWARE TEST VECTOR • ULX3S FPGA</text>
</svg>
